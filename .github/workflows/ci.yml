name: Axiom CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  audit-and-verify:
    name: Guards Audit & Workspace Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/*
            bin/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git Identity for Audit Logger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Format Check (cargo fmt)
        run: cargo fmt --all --check

      - name: Workspace Static Analysis (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Workspace Test Suite
        run: cargo test --workspace --all-targets

      - name: Run Guards Audit Gatekeeper
        env:
          CI: "true"
        run: python3 tools/guards.py

      - name: Archive Audit Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit-logs
          path: logs/
          retention-days: 14
