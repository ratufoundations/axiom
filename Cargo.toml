[workspace]
members = [
    "crates/ratu-aurion-primitives",
    "crates/ratu-aurion-storage",
    "crates/ratu-aurion-index",
    "crates/ratu-aurion-engine",
    "crates/ratu-aurion-consensus",
    "crates/ratu-aurion-network",
    "crates/ratu-aurion-archive",
    "bin/ratu-aurion-node",
    "bin/ratu-aurion-cli",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
suboptimal_flops = "deny"
imprecise_flops = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
